name: rerender

# 이미 만든 쇼츠(단어/왕초보)를 현재 코드로 다시 만들어 같은 이름의 Release를 교체. 기록(history)은 바꾸지 않음.
on:
  workflow_dispatch:
    inputs:
      vocab_from:
        description: "단어 시작 Day (0=안 함)"
        default: "0"
      vocab_count:
        description: "단어 개수"
        default: "10"
      basic_from:
        description: "왕초보 시작 Day (0=안 함)"
        default: "0"
      basic_count:
        description: "왕초보 개수"
        default: "10"

permissions:
  contents: write

concurrency: daily-shorts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Seoul
      TOPIK_LEVEL: ${{ vars.TOPIK_LEVEL || '初級' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || '毎日韓国語' }}
      VOICE_KO: ${{ vars.VOICE_KO || 'ko-KR-SunHiNeural' }}
      VOICE_JA: ${{ vars.VOICE_JA || 'ja-JP-NanamiNeural' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo apt-get update -qq $APT_OPTS && sudo apt-get install -y -qq $APT_OPTS ffmpeg fonts-noto-cjk && break
            [ "$i" = 3 ] && exit 1
            echo "apt failed (attempt $i), retrying in 60s"; sleep 60
          done
          pip install -r requirements.txt
      - name: Render
        env:
          TTS_STRICT: "1"
        run: |
          render() {  # kind from count
            [ "$2" -gt 0 ] || return 0
            for ((d=$2; d<$2+$3; d++)); do
              f=$(printf "content/used/%s_%03d.json" "$1" "$d")
              [ -f "$f" ] || { echo "::warning::$f 없음 → 건너뜀"; continue; }
              python -m shorts "$1" --file "$f" --day "$d"
            done
          }
          render vocab "${{ inputs.vocab_from }}" "${{ inputs.vocab_count }}"
          render basic "${{ inputs.basic_from }}" "${{ inputs.basic_count }}"
      - name: Publish (replace releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_releases.sh
